name: CI (checks en PR)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: SBOM (CycloneDX)
        run: npm sbom --omit dev --format cyclonedx-json > sbom.cdx.json

      - name: Subir SBOM como artifacto
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json