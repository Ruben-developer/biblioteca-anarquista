name: Deploy preview (develop)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build (preview)
        run: npm run build -- --base=/preview/
        env:
          VITE_PDF_BASE: ${{ secrets.VITE_PDF_BASE }}

      - name: Publicar en rama gh-pages (preview/develop)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: preview
          keep_files: true