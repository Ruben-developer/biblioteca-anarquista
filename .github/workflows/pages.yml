name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Auditoría de seguridad (informativa)
        run: npm audit --audit-level=high || true
        # Las vulnerabilidades restantes son de esbuild (dev-server de Vite,
        # transitiva de vitest) y solo se resuelven con vite@8 (breaking).
        # No aplican al deploy estático de GitHub Pages. Se informan sin bloquear.

      - name: Build
        run: npm run build
        env:
          # URL pública de los PDFs para producción (túnel Cloudflare, Tailscale
          # Serve, etc.). Si no existe el secret, el fallback es /pdfs/ (solo útil
          # con el proxy de Vite en desarrollo). La IP interna NUNCA va en el repo.
          VITE_PDF_BASE: ${{ secrets.VITE_PDF_BASE }}

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
