<!DOCTYPE html>
<html lang="es" data-estilo="clasico" data-modo="dia">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Idea · Biblioteca Digital Anarquista</title>
    <meta name="description" content="La Idea, biblioteca digital anarquista: más de 1.800 textos en PDF, línea temporal, mapa de regiones, biografías y rutas de lectura" />
    <script>
      // Anti-destello: aplica el estilo y el modo guardados antes de pintar.
      // Sin esto, el HTML saldría con los valores por defecto y cambiaría al
      // hidratar.
      (function () {
        var validos = ['clasico', 'collage-vino'];
        try {
          var pedido = new URLSearchParams(location.search).get('estilo');
          var guardado = pedido || localStorage.getItem('laidea_estilo_v1');
          if (guardado && validos.indexOf(guardado) !== -1) {
            document.documentElement.dataset.estilo = guardado;
          }
          if (JSON.parse(localStorage.getItem('darkMode') || 'false')) {
            document.documentElement.dataset.modo = 'noche';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function(){
        var A='https://server.taile963c6.ts.net';
        function b(p){new Image().src=A+'/pixel.gif?p='+encodeURIComponent(p||location.pathname)}
        b();
        var o=history.pushState;
        history.pushState=function(){o.apply(this,arguments);b(arguments[2]||location.pathname)};
        addEventListener('popstate',function(){b(location.pathname)});
      })();
    </script>
  </body>
</html>
